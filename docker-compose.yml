volumes:
  postgres_data:
  redis_data:

networks:
  github-subscriptions:
    name: subscriptions

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    networks:
      github-subscriptions:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 20

  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      github-subscriptions:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1s
      timeout: 1s
      retries: 20

  # HTTP API + release-check cron. Publishes notification jobs to Redis.
  api:
    build:
      context: ./
      dockerfile: ./services/api/Dockerfile
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
    expose:
      - '${SERVER_PORT}'
    env_file:
      - ./.env
    # Override host-oriented .env values so the container talks to the
    # in-network postgres/redis regardless of the developer's local .env.
    environment:
      DB_DSN: "host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable"
      REDIS_ADDRESS: "redis:6379"
      REDIS_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      logging: "app"
    networks:
      github-subscriptions:
        aliases:
          - api
          - backend

  # Notifications microservice. Subscribes to the Redis channel and sends email.
  notifier:
    build:
      context: ./
      dockerfile: ./services/notifications/Dockerfile
    env_file:
      - ./.env
    # Talk to the in-network redis regardless of the developer's local .env.
    environment:
      REDIS_ADDRESS: "redis:6379"
      REDIS_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
    labels:
      logging: "app"
    networks:
      github-subscriptions:
        aliases:
          - notifier
