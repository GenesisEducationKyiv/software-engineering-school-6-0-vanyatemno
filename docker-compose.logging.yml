# Local logging pipeline overlay.
#
# Use together with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.logging.yml up --build
# or via the Makefile: `make logging-up`.
#
# It adds an Elasticsearch + Kibana + Filebeat stack on the same network as the
# app, labels the backend so Filebeat collects only its (JSON) logs, and points
# the backend at the in-network Postgres/Redis so the stack is self-contained.
#
# NOTE: this is a development-only stack meant to run on your machine. A
# production Elasticsearch cluster should be provisioned through DevOps/IT.

volumes:
  elasticsearch_data:

services:
  # The base compose file's postgres service doesn't set credentials, so the
  # container refuses to initialize. Supply them here (from .env) so the whole
  # logging stack comes up self-contained via `make logging-up`.
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      github-subscriptions:
        aliases:
          - redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # The label Filebeat's autodiscover rule keys off of.
    labels:
      logging: "app"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
    # Override host-oriented .env values so the container talks to the
    # in-network services and emits JSON logs for the pipeline.
    environment:
      DB_DSN: "host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable"
      REDIS_ADDRESS: "redis:6379"
      REDIS_PASSWORD: ""
      LOG_LEVEL: "info"
      LOG_ENCODING: "json"
      LOG_ENVIRONMENT: "docker"
      LOG_SERVICE_NAME: "se-school"
    depends_on:
      - redis
      - postgres

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      # Keep the JVM heap small; this is a dev box, not a cluster.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      github-subscriptions:
        aliases:
          - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch.software-engineering-school-6-0-vanyatemno.orb.local:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      github-subscriptions:
        aliases:
          - kibana
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    # Filebeat needs root to read the Docker socket and container log files.
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./deploy/logging/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      github-subscriptions:
        aliases:
          - filebeat
