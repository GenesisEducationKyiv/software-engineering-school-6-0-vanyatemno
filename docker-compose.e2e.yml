networks:
  github-subscriptions-e2e:
    name: subscriptions-e2e

services:
  postgres-e2e:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - github-subscriptions-e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 1s
      timeout: 1s
      retries: 30

  # The notifier's own database for e2e (deliveries table / saga participant).
  notifier-postgres-e2e:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: notifier
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - github-subscriptions-e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d notifier"]
      interval: 1s
      timeout: 1s
      retries: 30

  redis-e2e:
    image: redis:7-alpine
    tmpfs:
      - /data
    networks:
      - github-subscriptions-e2e
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30

  kafka-e2e:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-e2e:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-e2e:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    # No tmpfs/volume: cp-kafka's writability precheck (dub) fails on a root-owned
    # tmpfs since it runs as appuser. The default image dir is appuser-owned and
    # the container is ephemeral (removed on `down -v`), which is fine for e2e.
    networks:
      - github-subscriptions-e2e
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    networks:
      - github-subscriptions-e2e

  backend:
    build:
      context: ./
      dockerfile: ./services/api/Dockerfile
    environment:
      DB_DSN: "host=postgres-e2e user=e2e password=e2e dbname=e2e port=5432 sslmode=disable"
      SERVER_PORT: "8080"
      SERVER_API_KEY: "e2e-key"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      REDIS_ADDRESS: "redis-e2e:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      KAFKA_BROKERS: "kafka-e2e:9092"
      KAFKA_REPLIES_TOPIC: "notifications.replies"
      NOTIFIER_ADDR: "notifier:9090"
      # Disable the release-check cron during e2e by scheduling it for
      # a date that won't fire during the run.
      CRON_REPO_CHECK_SCHEDULE: "0 0 1 1 *"
      FRONTEND_URL: "http://frontend:4173"
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy
      kafka-e2e:
        condition: service_healthy
      notifier:
        condition: service_started
    networks:
      - github-subscriptions-e2e

  # Notifications microservice: consumes saga commands the API produces to Kafka
  # and serves a synchronous gRPC delivery API; both deliver to mailpit, which the
  # e2e tests assert against.
  notifier:
    build:
      context: ./
      dockerfile: ./services/notifications/Dockerfile
    expose:
      - '9090'
    environment:
      GRPC_PORT: ":9090"
      MAILER_HOST: "mailpit"
      MAILER_PORT: "1025"
      MAILER_USERNAME: ""
      MAILER_FROM: "noreply@e2e.local"
      MAILER_SMTP: "mailpit"
      MAILER_PASSWORD: ""
      DB_DSN: "host=notifier-postgres-e2e user=e2e password=e2e dbname=notifier port=5432 sslmode=disable"
      REDIS_ADDRESS: "redis-e2e:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      KAFKA_BROKERS: "kafka-e2e:9092"
      KAFKA_REPLIES_TOPIC: "notifications.replies"
      LOG_ENCODING: "console"
    depends_on:
      redis-e2e:
        condition: service_healthy
      kafka-e2e:
        condition: service_healthy
      notifier-postgres-e2e:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - github-subscriptions-e2e

  frontend:
    build:
      context: ./
      dockerfile: ./tests/e2e/Dockerfile.frontend
      args:
        VITE_API_URL: "http://backend:8080/api"
        VITE_API_KEY: "e2e-key"
    networks:
      - github-subscriptions-e2e

  tests:
    build:
      context: ./
      dockerfile: ./tests/e2e/Dockerfile.runner
    environment:
      E2E_FRONTEND_URL: "http://frontend:4173"
      E2E_BACKEND_URL: "http://backend:8080"
      E2E_API_KEY: "e2e-key"
      E2E_MAILPIT_URL: "http://mailpit:8025"
      E2E_DB_DSN: "postgres://e2e:e2e@postgres-e2e:5432/e2e?sslmode=disable"
    depends_on:
      backend:
        condition: service_started
      notifier:
        condition: service_started
      frontend:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - github-subscriptions-e2e
