# Local metrics pipeline overlay.
#
# Use together with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up --build
# or via the Makefile: `make metrics-up`.
#
# It adds a Prometheus + Grafana stack on the same network as the app,
# scrapes the backend's /metrics endpoint (RED metrics exposed via
# internal/metrics + PrometheusMiddleware), and ships a provisioned RED
# dashboard. It mirrors the logging overlay (docker-compose.logging.yml).
#
# NOTE: this is a development-only stack meant to run on your machine. A
# production Prometheus/Grafana should be provisioned through DevOps/IT.

volumes:
  prometheus_data:
  grafana_data:

services:
  # The base compose file's postgres service doesn't set credentials, so the
  # container refuses to initialize. Supply them here (from .env) so the whole
  # metrics stack comes up self-contained via `make metrics-up`.
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  backend:
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
    # Override host-oriented .env values so the container talks to the
    # in-network services (Prometheus scrapes it by its `backend` alias).
    environment:
      DB_DSN: "host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable"
      REDIS_ADDRESS: "redis:6379"
      REDIS_PASSWORD: ""
    depends_on:
      - redis
      - postgres

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      github-subscriptions:
        aliases:
          - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      github-subscriptions:
        aliases:
          - grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
